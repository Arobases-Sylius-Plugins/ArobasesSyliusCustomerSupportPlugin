arobases_sylius_customer_support_plugin_admin_customer_support:
    resource: |
        alias: arobases_sylius_customer_support_plugin.customer_support
        path: customer-support
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        only: ['index', 'update', 'delete']
        redirect: update
        grid: arobases_admin_customer_support
        permission: true
        vars:
            all:
                hook_prefix: 'arobases_sylius_customer_support_plugin.admin.customer_support'
    type: sylius.resource

arobases_sylius_customer_support_plugin_admin_customer_support_change_status:
    path: /customer-support/{id}/change-status
    methods: [PATCH]
    requirements:
        id: \d+
    defaults:
        _controller: Arobases\SyliusCustomerSupportPlugin\Controller\ChangeStatusCustomerSupportController::changeStatus
        _sylius:
            section: admin
            redirect: arobases_sylius_customer_support_plugin_admin_customer_support_index
