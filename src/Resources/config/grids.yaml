sylius_grid:
    templates:
        action:
            close_ticket_admin: '@ArobasesSyliusCustomerSupportPlugin/admin/customer_support/grid/action/change_status.html.twig'
            close_ticket_shop: '@ArobasesSyliusCustomerSupportPlugin/shop/account/customer_support/grid/action/change_status.html.twig'
    grids:
        arobases_admin_customer_support:
            driver:
                name: doctrine/orm
                options:
                    class: '%arobases_sylius_customer_support_plugin.model.customer_support.class%'
            sorting:
                date_updated_at: desc
            fields:
                enabled:
                    type: twig
                    label: arobases_sylius_customer_support_plugin.ui.open
                    path: enabled
                    options:
                        template: '@SyliusAdmin/shared/grid/field/boolean.html.twig'
                date_updated_at:
                    type: datetime
                    label: arobases_sylius_customer_support_plugin.ui.updated_at
                    path: updatedAt
                    sortable: updatedAt
                    options:
                        format: d-m-Y H:i:s
                date_created_at:
                    type: datetime
                    label: arobases_sylius_customer_support_plugin.ui.created_at
                    path: createdAt
                    sortable: createdAt
                    options:
                        format: d-m-Y H:i:s
                number:
                    type: twig
                    label: sylius.ui.number
                    path: order
                    options:
                        template: '@SyliusAdmin/shared/grid/field/order_number.html.twig'
                channel:
                    type: twig
                    label: sylius.ui.channel
                    path: order.channel
                    options:
                        template: '@SyliusAdmin/shared/grid/field/channel.html.twig'
                customer:
                    type: twig
                    label: sylius.ui.customer
                    path: customer
                    sortable: customer.lastName
                    options:
                        template: '@SyliusAdmin/shared/grid/field/customer.html.twig'
            filters:
                number:
                    type: string
                    label: sylius.ui.number
                    options:
                        fields: [order.number]
                customer:
                    type: string
                    label: sylius.ui.customer
                    options:
                        fields: [customer.email, customer.firstName, customer.lastName]
                date_updated_at:
                    type: date
                    label: arobases_sylius_customer_support_plugin.ui.updated_at
                    options:
                        field: updatedAt
                        inclusive_to: true
                date_created_at:
                    type: date
                    label: arobases_sylius_customer_support_plugin.ui.created_at
                    options:
                        field: createdAt
                        inclusive_to: true
                channel:
                    type: entity
                    label: sylius.ui.channel
                    options:
                        fields: [order.channel]
                    form_options:
                        class: '%sylius.model.channel.class%'
                enabled:
                    type: boolean
                    label: arobases_sylius_customer_support_plugin.ui.open
            actions:
                item:
                    update:
                        type: update
                    close_ticket:
                        type: close_ticket_admin
                    delete:
                        type: delete

        arobases_shop_customer_support:
            driver:
                name: doctrine/orm
                options:
                    class: '%arobases_sylius_customer_support_plugin.model.customer_support.class%'
                    repository:
                        method: createByCustomerIdQueryBuilder
                        arguments:
                            - "expr:service('sylius.context.customer').getCustomer().getId()"
            sorting:
                date_updated_at: desc
            fields:
                number:
                    type: twig
                    label: arobases_sylius_customer_support_plugin.ui.order_number
                    path: order.number
                    options:
                        template: '@SyliusShop/account/order/grid/field/number.html.twig'
                enabled:
                    type: twig
                    label: arobases_sylius_customer_support_plugin.ui.open
                    path: enabled
                    options:
                        template: '@ArobasesSyliusCustomerSupportPlugin/shop/account/customer_support/grid/field/enabled.html.twig'
                date_updated_at:
                    type: datetime
                    label: arobases_sylius_customer_support_plugin.ui.updated_at
                    path: updatedAt
                    sortable: updatedAt
                    options:
                        format: d-m-Y H:i
                date_created_at:
                    type: datetime
                    label: arobases_sylius_customer_support_plugin.ui.created_at
                    path: createdAt
                    sortable: createdAt
                    options:
                        format: d-m-Y H:i
            filters:
                number:
                    type: shop_string
                    label: sylius.ui.number
                    options:
                        type: contains
                        fields: [order.number]
            actions:
                item:
                    show:
                        type: shop_show
                        label: sylius.ui.show
                        options:
                            link:
                                route: arobases_sylius_customer_support_plugin_shop_customer_support_update
                                parameters:
                                    id: resource.id
                    close_ticket:
                        type: close_ticket_shop
